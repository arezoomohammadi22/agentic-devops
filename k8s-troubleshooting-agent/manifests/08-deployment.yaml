apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-troubleshooting-agent
  namespace: k8s-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-troubleshooting-agent
  template:
    metadata:
      labels:
        app: k8s-troubleshooting-agent
    spec:
      serviceAccountName: k8s-troubleshooter
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: k8s-troubleshooting-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TARGET_NAMESPACE
              value: agent-lab
            - name: OPENAI_MODEL
              value: gpt-5.6-sol
            - name: MAX_TOOL_ROUNDS
              value: "8"
            - name: ENABLE_PV_LOOKUP
              value: "false"
            - name: LOCAL_KUBECONFIG
              value: "false"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: OPENAI_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
