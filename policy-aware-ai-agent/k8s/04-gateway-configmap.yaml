apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-gateway-config
  namespace: agent-system
data:
  config.yaml: |
    identity:
      agent_id: incident-agent
      roles: [incident-responder]
      capabilities: [get_logs, restart_deployment]
    namespaces:
      staging: agent-lab-staging
      production: agent-lab-production
    rate_limits:
      restart_deployment:
        max_calls: 3
        window_seconds: 600
    approval:
      ttl_seconds: 120
    executor:
      mode: kubernetes
      log_tail_lines: 50
